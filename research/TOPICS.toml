# 目的: この repo から出る「次の論文候補」の置き場。tetsuo-jp/topic-mining の tools/radar.py が各 repo の research/TOPICS.toml を集約する。
# 1 分で追加する方法: 下の [[topic]] を 1 ブロック複製し、id（変更しない）・title・value・effort・novelty・evidence（リポ内パス:行）・next を埋めて commit する。
# status は candidate|active|parked|done|dropped。着手したら active、見送るなら dropped に変えるだけでよい（消さない）。
# 台帳（registry）への登録は人の判断で別途行う。ここに書いただけでは台帳には載らない。
# score = 2*value + N + E + W + V - stale。N: new +3 / partial +1 / unclear 0 / known -5。E: S +2 / M +1 / L 0。
# W: waiting_on あり +1。V: venue あり +1。stale: updated から 90 日超で -1。順位の目安であって決定ではない。

repo = "tetsuo-jp/rc-lecture-notes"
